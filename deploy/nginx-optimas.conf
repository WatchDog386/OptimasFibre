# Nginx site for optimaswifi.co.ke
# Install:  sudo cp deploy/nginx-optimas.conf /etc/nginx/sites-available/optimas
#           sudo ln -sf /etc/nginx/sites-available/optimas /etc/nginx/sites-enabled/optimas
# Certbot adds the HTTPS (443) block to this file automatically.
server {
    listen 80;
    listen [::]:80;
    server_name optimaswifi.co.ke www.optimaswifi.co.ke;

    root /var/www/optimas/dist;
    index index.html;

    # Browser-generated PDFs and profile images are sent as base64 in JSON.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend API (Node, listening only on 127.0.0.1:10000)
    location /api/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # PDF generation can take a few seconds
    }

    # Portfolio images uploaded through the dashboard
    location /uploads/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        expires 7d;
    }

    location = /health {
        proxy_pass http://127.0.0.1:10000;
    }

    # Geofeed (carried over from vercel.json)
    location = /feed { return 301 /feed/; }
    location = /AS329741_Geofeed.csv { return 301 /feed/AS329741_Geofeed.csv; }
    location = /geofeed { return 301 /feed/AS329741_Geofeed.csv; }
    location = /feed/AS329741_Geofeed.csv {
        default_type "text/csv; charset=utf-8";
        add_header Content-Disposition 'attachment; filename="AS329741_Geofeed.csv"';
    }

    # Built JS/CSS have hashed names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React app: unknown paths load index.html so client-side routes work
    location / {
        try_files $uri $uri/ /index.html;
    }
}
